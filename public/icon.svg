<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="32%" cy="22%" r="95%">
      <stop offset="0" stop-color="#4A2A86"/>
      <stop offset="52%" stop-color="#7C1D5A"/>
      <stop offset="100%" stop-color="#150C2C"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A8"/>
      <stop offset="55%" stop-color="#FFB43C"/>
      <stop offset="100%" stop-color="#FF7A1F"/>
    </linearGradient>
    <radialGradient id="planet" cx="38%" cy="34%" r="75%">
      <stop offset="0" stop-color="#FFF1D2"/>
      <stop offset="60%" stop-color="#FFC061"/>
      <stop offset="100%" stop-color="#F0821C"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="96" cy="120" r="4" opacity="0.9"/>
    <circle cx="150" cy="360" r="3" opacity="0.7"/>
    <circle cx="404" cy="150" r="3.5" opacity="0.85"/>
    <circle cx="430" cy="330" r="4.5" opacity="0.8"/>
    <circle cx="360" cy="410" r="3" opacity="0.7"/>
    <circle cx="110" cy="250" r="2.5" opacity="0.6"/>
    <circle cx="256" cy="86" r="3" opacity="0.7"/>
  </g>
  <g fill="#FFE7A8">
    <circle cx="120" cy="140" r="1.6"/>
    <circle cx="392" cy="380" r="1.6"/>
    <circle cx="440" cy="200" r="1.6"/>
  </g>

  <!-- Saturn ring (back), planet, then ring (front) for depth -->
  <ellipse cx="256" cy="272" rx="176" ry="58" fill="none" stroke="url(#gold)" stroke-width="16"
           transform="rotate(-22 256 272)" opacity="0.35"/>
  <circle cx="256" cy="256" r="104" fill="url(#planet)"/>
  <path d="M 96 232 A 176 58 -22 0 0 416 300"
        fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"
        transform="rotate(-22 256 266)" opacity="0.95"/>

  <!-- tiny orbiting moon -->
  <circle cx="392" cy="176" r="12" fill="url(#gold)"/>
</svg>
